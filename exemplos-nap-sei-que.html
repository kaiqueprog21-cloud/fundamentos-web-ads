<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <H1>Pagina de cadastro - Exemplo</H1>
    </header>
        <main>
            <section>
                <form id="registerForm" method="POST">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required/>
                    <br>
                    <label for="email">Informe seu Email:</label>
                    <input type="email" id="email" name="email" required/>
                    <br>
                    <label for="senha">Informe a sua senha:</label>
                    <input name="senha" id="senha" type="password" required minlength="8" maxlength="12"/>
                    <br>
                    <input type="text" id="cpf" name="cpf" placeholder="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="formato esperado: 123.456.789-00"/> 
                    <br>


                    <textarea id="mensagem" name="mensagem" rows="4" cols="30" placeholder="Digite um texto"></textarea>
                    <br>
                    <br>
                    <label for="evento">Escolha o seu evento:</label>
                    <select name="evento" id="evento">
                        <option value="Rock">Rock Consert</option>
                        <option value="Pagode">Pagode</option>
                        <option value="Jogos">Jogos</option>
                    </select>
                    <br>
                    <label for="termos">
                        <input type="checkbox" name="termos" id="termos" required/> Concordo com os termosde uso
                    </label>
                    <br>
                    <label>
                        <input type="radio" Value="pix" name="pagamento"/>Pix
                    </label>
                    <label>
                        <input type="radio" Value="Cartao" name="pagamento"/>Cartao
                    </label>
                    <br>
                    <input type="number" step="5" />
                    <input type="submit" value="Cadastrar" />


                </form>
            </section>
        </main>
    <footer>
        <p> &copy; Desenvolvido por Kaique</p>
    </footer>
    <script>
        // Pegando atraves do id do formulario o evento de submissão (envio) do Forms
        document.getElementById("registerForm").addEventListener("submit",function(event){
            event.preventDefault(); //Este comando envita o recarregamento da pagina
            const nome = document.getElementById("nome").value
            alert("Ola" +nome+ " o foi formulario Preenchido")          
        })
    </script>
</body>
</html>
